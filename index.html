<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ToDo List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        margin: 0;
        padding: 0;
        background-color: #d4a5ff;
        color: #1e1e1e;
      }
      #container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin-top: 2rem;
        padding: 0 1rem;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        font-weight: 600;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        margin-bottom: 20px;
        color: #3a86ff;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        text-align: center;
        width: auto;
        padding: 1rem;
        margin-left: 0px;
        animation: pop-up 1.5s ease forwards;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
      @keyframes pop-up {
        0% {
          transform: translateY(30px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .social-input {
        margin: 0px 0;
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 500px;
        justify-content: center;
      }
      .social-input input {
        flex: 1;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-right: 10px;
        max-width: 300px;
        font-size: 16px;
        box-sizing: border-box;
      }
      #instagramBtn {
        background-color: #ff6b6b;
        text-align: center;
        align-items: center;
        cursor: pointer;
        border: 2px solid white;
        font-family: "Oswald", sans-serif;
        font-weight: 700;
        padding: 10px 20px;
        width: auto;
        min-width: 10rem;
        height: auto;
        font-size: 16px;
        border-radius: 50px;
        margin-top: 30px;
        transition: all 0.3s ease;
      }
      #instagramBtn:hover {
        background-color: #0096ff;
        border: 2px solid black;
      }
      #feedDisplay {
        width: 90%;
        max-width: 600px;
        min-height: 200px;
        background: white;
        border: 1px solid #ddd;
        padding: 15px;
        overflow: auto;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin: 3rem auto;
        box-sizing: border-box;
      }
      #feedDisplay h2 {
        margin: 0 0 15px;
        font-size: 1.5rem;
        text-align: center;
      }
      .posttotal {
        background-color: #f9f9f9;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin: 8px 0;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: nowrap;
        width: 100%;
        box-sizing: border-box;
      }
      .post {
        flex: 1;
        min-width: 0;
        word-break: break-word;
        overflow-wrap: break-word;
        padding-right: 10px;
        font-size: 16px;
      }
      #postInput {
        width: 100%;
        max-width: 300px;
        border: 3px solid black;
        border-radius: 25px;
        margin-top: 15px;
        box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.2);
        padding: 12px 15px;
        font-size: 16px;
        box-sizing: border-box;
      }
      .feedContainerbut {
        border: none;
        border-radius: 5px;
        background-color: rgb(219, 14, 14);
        color: white;
        font-family: "Oswald", sans-serif;
        padding: 8px 12px;
        cursor: pointer;
        min-width: 100px;
        font-size: 14px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.3s ease;
      }
      .feedContainerbut:hover {
        background-color: rgb(165, 9, 9);
      }
      .donetick {
        width: 30px;
        height: 30px;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .donetick img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .donetick:hover {
        border: 1px solid rgb(12, 121, 12);
        border-radius: 100%;
      }
      .allbut {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      /* Mobile Responsive Styles */
      @media (max-width: 768px) {
        #container {
          margin-top: 1.5rem;
          padding: 0 0.5rem;
        }
        
        h1 {
          font-size: clamp(2rem, 6vw, 3rem);
          padding: 0.5rem;
          margin-bottom: 15px;
        }
        
        .social-input {
          flex-direction: column;
          gap: 10px;
        }
        
        .social-input input {
          max-width: 100%;
          margin-right: 0;
          width: 90%;
        }
        
        #instagramBtn {
          min-width: 8rem;
          padding: 10px 15px;
          font-size: 15px;
          margin-top: 20px;
        }
        
        #feedDisplay {
          width: 95%;
          margin: 2rem auto;
          padding: 12px;
        }
        
        #feedDisplay h2 {
          font-size: 1.3rem;
          margin-bottom: 12px;
        }
        
        .posttotal {
          flex-wrap: wrap;
          padding: 10px 12px;
          gap: 0.8rem;
          margin: 6px 0;
        }
        
        .post {
          width: 100%;
          order: 1;
          padding-right: 0;
          margin-bottom: 5px;
        }
        
        .donetick {
          order: 2;
          margin-right: auto;
        }
        
        .feedContainerbut {
          order: 3;
          margin-left: auto;
          min-width: 90px;
          padding: 7px 10px;
          font-size: 13px;
        }
        
        #postInput {
          max-width: 100%;
          width: 90%;
          padding: 10px 12px;
        }
      }

      @media (max-width: 480px) {
        #container {
          margin-top: 1rem;
        }
        
        h1 {
          font-size: clamp(1.8rem, 5vw, 2.5rem);
          padding: 0.5rem;
        }
        
        #feedDisplay {
          width: 98%;
          margin: 1.5rem auto;
          padding: 10px;
        }
        
        .posttotal {
          flex-direction: column;
          align-items: stretch;
          gap: 0.5rem;
          padding: 8px 10px;
        }
        
        .post {
          width: 100%;
          order: 1;
          text-align: center;
          margin-bottom: 8px;
        }
        
        .donetick {
          order: 2;
          margin: 0 auto;
          width: 28px;
          height: 28px;
        }
        
        .feedContainerbut {
          order: 3;
          margin: 0 auto;
          width: 100%;
          max-width: 200px;
          min-width: auto;
          padding: 8px;
          font-size: 14px;
        }
        
        #instagramBtn {
          min-width: 7rem;
          padding: 9px 14px;
          font-size: 14px;
        }
        
        .social-input input,
        #postInput {
          width: 95%;
          padding: 10px;
          font-size: 15px;
        }
      }

      @media (max-width: 320px) {
        h1 {
          font-size: 1.6rem;
        }
        
        .social-input input,
        #postInput {
          width: 100%;
        }
        
        #instagramBtn {
          min-width: 6rem;
          padding: 8px 12px;
          font-size: 13px;
        }
        
        .feedContainerbut {
          font-size: 12px;
          padding: 6px 8px;
        }
        
        .post {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Devinaa ke To-Dos</h1>
     
      <div class="social-input">
        <input
          oninput="inputadd()"
          type="text"
          id="postInput"
          placeholder="Enter your task here"
        />
      </div>
      <div class="allbut">
        <button class="button" id="instagramBtn">Add Task</button>
      </div>
    </div>
    <div id="feedDisplay">
      <h2>Task Display</h2>
      <div id="feedContainer"></div>
     <h3>From ur Hubby 💘</h3> 
    </div>
    <script>
      const feedContainer = document.getElementById("feedContainer");
      const postInput = document.getElementById("postInput");
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

      function displayTasks() {
        feedContainer.innerHTML = "";
        tasks.forEach((task, index) => {
          const newPost = document.createElement("div");
          newPost.className = "posttotal";
          const newpost2 = document.createElement("div");
          newpost2.className = "post";
          newpost2.textContent = task.text;
          const butchange = document.createElement("button");
          butchange.className = "feedContainerbut";
          butchange.innerText = "Delete Task";
          const done = document.createElement("div");
          done.className = "donetick";
          done.innerHTML =
            '<img class="donetick" src="https://cdn-icons-png.flaticon.com/128/711/711239.png">';

          if (task.done) {
            newpost2.innerHTML = `<del>${task.text}</del>`;
            newpost2.style.color = "green";
          }

          newPost.appendChild(newpost2);
          newPost.appendChild(done);
          newPost.appendChild(butchange);

          feedContainer.appendChild(newPost);

          butchange.addEventListener("click", function () {
            tasks.splice(index, 1);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            displayTasks();
          });

          done.addEventListener("click", function () {
            tasks[index].done = !tasks[index].done;
            localStorage.setItem("tasks", JSON.stringify(tasks));
            displayTasks();
          });
        });
      }

      document.getElementById("instagramBtn").onclick = function () {
        const post = postInput.value.trim();
        if (post) {
          tasks.push({ text: post, done: false });
          localStorage.setItem("tasks", JSON.stringify(tasks));
          postInput.value = "";
          displayTasks();
        }
      };

      // Allow adding tasks with Enter key
      postInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          document.getElementById("instagramBtn").click();
        }
      });

      displayTasks();
    </script>
  </body>
</html>
